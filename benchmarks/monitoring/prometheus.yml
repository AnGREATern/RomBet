global:
  scrape_interval: 15s
  evaluation_interval: 15s

remote_write:
  - url: "http://host.docker.internal:9090/api/v1/write"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'rombet-service'
    # # Use Docker service discovery for dynamically created containers
    # dockerswarm_sd_configs:
    #   - host: unix:///var/run/docker.sock
    #     role: tasks
    #     port: 3000
    metrics_path: '/metrics'
    scrape_interval: 5s
