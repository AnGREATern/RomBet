server {
    listen 8090;
    server_name localhost;

    root /Users/v.r.romanov/Documents/bmstu/RomBet;

    location = / {
        try_files /static/index.html =404;
    }

    location = /reserved {
        try_files /static/index.html =404;
    }

    location = /api/v1 {
        try_files /swagger/index.html =404;
    }

    location ~ ^/api/v1/.+$ {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /legacy {
        try_files /static/legacy.html =404;
    }

    location = /documentation {
        try_files /static/doc.html =404;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:5050/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Script-Name /admin;
    }

    location = /status {
        try_files /static/status.html =404;
    }
    
    location = /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }

    location = /management {
        try_files /static/management.html =404;
    }

    location ~* ^/(?!admin/)([^.]+)\.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.(git|env) {
        deny all;
    }
}
