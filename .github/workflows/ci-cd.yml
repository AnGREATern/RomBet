name: RomBet CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run unit tests in Docker
        run: |
          docker build -t rombet-unit-tests -f Dockerfile.unit .
          docker run --rm rombet-unit-tests

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d postgres

      - name: Wait for PostgreSQL
        run: |
          until docker compose -f docker-compose.test.yml exec -T postgres pg_isready -U postgres; do sleep 2; done

      - name: Run integration tests
        run: |
          docker compose -f docker-compose.test.yml run --rm rombet-tests sh -c "
            cargo run --bin db migrate &&
            cargo test --package db --package application -- --test-threads=1
          "

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start full application stack
        run: |
          docker compose -f docker-compose.test.yml up -d
          sleep 30

      - name: Wait for application
        run: |
          timeout 60s bash -c 'until curl -f http://localhost:8080/health; do sleep 5; done'

      - name: Run E2E tests
        run: |
          docker compose -f docker-compose.test.yml run --rm newman-tests

      - name: Collect test results
        if: always()
        run: |
          docker compose -f docker-compose.test.yml logs rombet > app.log
          docker compose -f docker-compose.test.yml cp rombet:/app/test-results ./test-results/ || true
          docker compose -f docker-compose.test.yml cp rombet:/app/allure-report ./allure-report/ || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-results
          path: |
            test-results/
            allure-report/
            app.log

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down
