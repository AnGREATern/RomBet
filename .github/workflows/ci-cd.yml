name: RomBet CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run unit tests in Docker
        run: docker-compose run rombet sh -c "./make_report -u"
        
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: units-results
          path: |
            test-results/
            allure-history/
            allure-report/      
            
      - name: Stop services
        if: always()
        run: docker compose down

  integration-tests:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run integrations tests in Docker
        run: docker-compose run rombet sh -c "./make_report -i"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integrations-results
          path: |
            test-results/
            allure-history/
            allure-report/

      - name: Stop services
        if: always()
        run: docker compose down

  e2e-tests:
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run e2e tests in Docker
        run: docker-compose run rombet sh -c "./make_report -e"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-results
          path: |
            test-results/
            allure-history/
            allure-report/

      - name: Stop services
        if: always()
        run: docker compose down
