      - name: Run integration tests
        run: |
          docker compose up -d
          sleep 5
          docker compose exec rombet sh -c "./make_report.sh -i"
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integrations-results
          path: |
            test-results/
            allure-history/
            allure-report/

      - name: Stop services
        if: always()
        run: docker compose down

