  integration-tests:
    # needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # - name: Download unit tests artifacts
      #   uses: actions/download-artifact@v4
      #   with:
      #     name: units-results
      #     path: ./

      # - name: Setup Postgres
      #   run: |
      #     docker compose up -d postgres
